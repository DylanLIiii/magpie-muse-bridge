name: Test SDK bridge

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:bun
